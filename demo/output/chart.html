<text x="56" y="46" font-size="11" fill="#8a3b3b">server down</text>
<line x1="50" y1="300" x2="900" y2="300" stroke="#333"/>
<line x1="50" y1="30" x2="50" y2="300" stroke="#333"/>
<text x="50" y="332" font-size="11">time (seconds): 0 to 3.5</text>
<text x="6" y="42" font-size="11">max 1498 req/bucket</text>
